services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: rrnet-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rrnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rrnet_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rrnet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rrnet} -d ${POSTGRES_DB:-rrnet_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Expose on localhost ONLY for host-networked backend
    ports:
      - "127.0.0.1:5432:5432"

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: rrnet-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - rrnet-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Expose on localhost ONLY for host-networked backend
    ports:
      - "127.0.0.1:6379:6379"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: rrnet-nginx-prod
    restart: unless-stopped
    # Use host network to simplify proxying to backend/frontend on 127.0.0.1
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend

  # Database Migration
  migrate:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: rrnet-migrate-prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rrnet}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-rrnet_prod}?sslmode=disable
    entrypoint: ["/bin/bash", "-c", "/app/rrnet-migrate -url \"$$DATABASE_URL\" -dir /app/migrations up"]
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy

  # Backend API
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
      network: host
    container_name: rrnet-backend-prod
    restart: unless-stopped
    # Required for host-level networking and iptables management
    network_mode: host
    environment:
      APP_ENV: production
      APP_NAME: rrnet-api
      APP_PORT: 8080
      # Use 127.0.0.1 because we're on host network connecting to exposed DB/Redis
      DATABASE_URL: postgres://${POSTGRES_USER:-rrnet}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-rrnet_prod}?sslmode=disable
      REDIS_ADDR: 127.0.0.1:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      # JWT secrets
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      WA_GATEWAY_URL: http://127.0.0.1:3001
      WA_GATEWAY_ADMIN_TOKEN: ${WA_ADMIN_TOKEN:-dev-wa-admin-token}
      # OAuth Configuration for Google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: https://billrrnet.tech/api/v1/auth/google/callback
      FRONTEND_URL: https://billrrnet.tech
      VPN_DOMAIN: vpn.billrrnet.tech
      PUBLIC_IP: 72.60.74.209
    depends_on:
      migrate:
        condition: service_started
    # Allow backend to manage host-level VPN users & iptables rules
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      # VPN user management: backend writes VPN credentials here
      - /etc/ppp/chap-secrets:/etc/ppp/chap-secrets:rw
      # IPsec PSK: backend reads PSK for script generation
      - /etc/ipsec.secrets:/etc/ipsec.secrets:ro
      # VPN scripts: mounted from host (needs execute permission)
      - /opt/rrnet/scripts:/opt/rrnet/scripts:rw
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      network: host
      args:
        - NEXT_PUBLIC_API_URL=https://billrrnet.tech/api/v1
    container_name: rrnet-frontend-prod
    restart: unless-stopped
    # Use host network for easier reverse proxy from Nginx on 127.0.0.1
    network_mode: host
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://billrrnet.tech/api/v1}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # WhatsApp Gateway (Baileys)
  wa-gateway:
    build:
      context: ./wa-gateway
      network: host
    container_name: rrnet-wa-gateway-prod
    restart: unless-stopped
    # Expose to localhost so backend can reach it
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      WA_PORT: "3001"
      WA_DATA_DIR: /app/data
      WA_ADMIN_TOKEN: ${WA_ADMIN_TOKEN:-dev-wa-admin-token}
      WA_SEND_DELAY_MS: "1500"
      WA_SEND_JITTER_MS: "1000"
    volumes:
      - wa_gateway_data:/app/data
    networks:
      - rrnet-network

  # FreeRADIUS (Hotspot voucher-only MVP)
  freeradius:
    build:
      context: ./infra/freeradius
      network: host
    container_name: rrnet-freeradius-prod
    restart: unless-stopped
    environment:
      # Use 127.0.0.1:8080 since backend is on host network
      RRNET_RADIUS_REST_BASE: "http://127.0.0.1:8080/api/v1/radius"
      RRNET_RADIUS_REST_SECRET: ${RRNET_RADIUS_REST_SECRET:-dev-radius-rest-secret}
    command: ["freeradius", "-X"]
    network_mode: host
    depends_on:
      - backend

  # SoftEther VPN Server (SSTP Support for stable connections)
  softether:
    image: siomiz/softether
    container_name: rrnet-sstp
    restart: always
    privileged: true
    # Use host network to simplify port management and IP access
    network_mode: host
    environment:
      - "USERS=vpn-admin-rrnet:rrnet-pass-2024" # Default admin user
    volumes:
      # Synchronize with the same secrets used by L2TP/xl2tpd
      - /etc/ppp/chap-secrets:/etc/ppp/chap-secrets:ro
    # Note: SoftEther by default listens on 443, 992, 1194, 5555. 
    # Since Nginx is on 443, we'll need to change SoftEther port later via management if needed.
    # But for now, we'll assume it's okay because we'll use 4443 if we mapped it.
    # Wait, if network_mode: host, I can't map. 
    # I'll switch to specific ports instead.
    ports:
      - "4443:443"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  wa_gateway_data:
    driver: local

networks:
  rrnet-network:
    driver: bridge
