version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: rrnet-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rrnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rrnet_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rrnet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rrnet} -d ${POSTGRES_DB:-rrnet_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Expose on localhost ONLY for host-networked backend
    ports:
      - "127.0.0.1:5432:5432"

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: rrnet-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - rrnet-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Expose on localhost ONLY for host-networked backend
    ports:
      - "127.0.0.1:6379:6379"

  # Backend API
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: rrnet-backend-prod
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_NAME: rrnet-api
      APP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-rrnet}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-rrnet_prod}?sslmode=disable
      REDIS_ADDR: 127.0.0.1:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      # JWT secrets (should be in secrets manager in production)
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      WA_GATEWAY_URL: http://127.0.0.1:3001
      WA_GATEWAY_ADMIN_TOKEN: ${WA_ADMIN_TOKEN:-dev-wa-admin-token}
      # OAuth Configuration for Google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: https://billrrnet.tech/api/v1/auth/google/callback
      FRONTEND_URL: https://billrrnet.tech
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Use host network so backend can manage host iptables rules for Winbox remote access
    # Backend connects to postgres/redis via host network (127.0.0.1 or container IP)
    network_mode: host
    # ports: not needed with host networking
    # Allow backend to manage host-level VPN users & iptables rules
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      # VPN user management: backend writes VPN credentials here
      - /etc/ppp/chap-secrets:/etc/ppp/chap-secrets:rw
      # IPsec PSK: backend reads PSK for script generation
      - /etc/ipsec.secrets:/etc/ipsec.secrets:ro
      # VPN scripts: mounted from host (needs execute permission)
      - /opt/rrnet/scripts:/opt/rrnet/scripts:rw
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://billrrnet.tech/api/v1
    container_name: rrnet-frontend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8080}
    depends_on:
      - backend
    networks:
      - rrnet-network
    # ports:
    #   - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # WhatsApp Gateway (Baileys)
  wa-gateway:
    build:
      context: ./wa-gateway
    container_name: rrnet-wa-gateway-prod
    restart: unless-stopped
    environment:
      WA_PORT: "3001"
      WA_DATA_DIR: /app/data
      WA_ADMIN_TOKEN: ${WA_ADMIN_TOKEN:-dev-wa-admin-token}
      WA_SEND_DELAY_MS: "1500"
      WA_SEND_JITTER_MS: "1000"
    # ports:
    #   - "3001:3001"
    volumes:
      - wa_gateway_data:/app/data
    networks:
      - rrnet-network

  # FreeRADIUS (Hotspot voucher-only MVP)
  freeradius:
    build:
      context: ./infra/freeradius
    container_name: rrnet-freeradius-prod
    restart: unless-stopped
    environment:
      # Backend REST endpoints consumed by rlm_rest inside FreeRADIUS
      RRNET_RADIUS_REST_BASE: "http://backend:8080/api/v1/radius"
      # Shared secret between FreeRADIUS -> RRNET backend REST endpoints
      RRNET_RADIUS_REST_SECRET: ${RRNET_RADIUS_REST_SECRET:-dev-radius-rest-secret}
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    depends_on:
      - backend
    networks:
      - rrnet-network

  # Nginx Reverse Proxy (Optional - for HTTPS termination)
  nginx:
    image: nginx:alpine
    container_name: rrnet-nginx-prod
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - frontend
      - backend
    networks:
      - rrnet-network
    profiles:
      - with-nginx

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  wa_gateway_data:
    driver: local

networks:
  rrnet-network:
    driver: bridge

